name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint and check formatting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgres://froggobank:froggobank@localhost:5432/froggobank_test?sslmode=disable

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: froggobank
          POSTGRES_PASSWORD: froggobank
          POSTGRES_DB: froggobank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U froggobank -d froggobank_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run database migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          "$(go env GOPATH)/bin/goose" \
            -dir migrations \
            postgres \
            "$TEST_DATABASE_URL" \
            up

      - name: Test
        run: go test ./...
